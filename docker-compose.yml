services:
  wa-gateway:
    build: ./wa-gateway
    container_name: wa_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_KEY=${WA_GATEWAY_API_KEY:-}
    volumes:
      - wa_auth:/app/auth_info

  ethol-notifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ethol_notifier
    restart: unless-stopped
    depends_on:
      - wa-gateway
    env_file: .env
    environment:
      # fallback kalau .env tidak ada, override di sini
      - WA_GATEWAY_URL=http://wa-gateway:3000
    volumes:
      - ./state.json:/app/state.json

  # Opsional: kalau masih mau pakai Evolution API lama, uncomment ini
