services:
  wa-gateway:
    build: ./wa-gateway
    container_name: wa_gateway
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - API_KEY=${WA_GATEWAY_API_KEY:-}
    volumes:
      - wa_auth:/app/auth_info

  ethol-notifier:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ethol_notifier
    restart: unless-stopped
    depends_on:
      - wa-gateway
      # jika pakai VPN, tunggu gluetun ready
      # gluetun:
      #   condition: service_healthy
    env_file: .env
    environment:
      # fallback kalau .env tidak ada, override di sini
      - WA_GATEWAY_URL=http://wa-gateway:3000
      # jika pakai gluetun http proxy, otomatis pakai proxy untuk ethol saja (WA tetap direct)
      # HTTP_PROXY diset via .env kalau GLUETUN_VPN_ENABLED=true
      - HTTP_PROXY=${HTTP_PROXY:-}
      - HTTPS_PROXY=${HTTP_PROXY:-}
      - NO_PROXY=wa-gateway,localhost,127.0.0.1
    volumes:
      - ethol_state:/app/data

  # ── Gluetun VPN (berbayar/Proton custom, aktifkan: docker compose --profile vpn up -d) ──
  gluetun:
    image: qmcgaw/gluetun:latest
    container_name: gluetun
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun
    ports:
      - "8888:8888/tcp"
    environment:
      - VPN_SERVICE_PROVIDER=${VPN_SERVICE_PROVIDER:-custom}
      - VPN_TYPE=${VPN_TYPE:-wireguard}
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY:-}
      - WIREGUARD_ADDRESSES=${WIREGUARD_ADDRESSES:-}
      - WIREGUARD_PUBLIC_KEY=${WIREGUARD_PUBLIC_KEY:-}
      - WIREGUARD_ENDPOINT_IP=${WIREGUARD_ENDPOINT_IP:-}
      - WIREGUARD_ENDPOINT_PORT=${WIREGUARD_ENDPOINT_PORT:-}
      - WIREGUARD_TOKEN=${WIREGUARD_TOKEN:-}
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Singapore}
      - OPENVPN_USER=${OPENVPN_USER:-}
      - OPENVPN_PASSWORD=${OPENVPN_PASSWORD:-}
      - HTTPPROXY=on
      - HTTPPROXY_LOG=off
      - HEALTH_VPN_DURATION_INITIAL=30s
    volumes:
      - gluetun:/gluetun
    restart: unless-stopped
    profiles:
      - vpn
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "https://ethol.pens.ac.id"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Tor (GRATIS, aktifkan: docker compose --profile tor up -d) ──
  # IP ganti tiap 10 menit / manual NEWNYM. Lambat & sering di-block, pakai hanya jika tidak ada VPN.
  tor:
    image: dperson/torproxy:latest
    container_name: tor
    ports:
      - "9050:9050" # socks5
      - "9051:9051" # control
    environment:
      - PASSWORD=${TOR_PASSWORD:-ethol123}
    restart: unless-stopped
    profiles:
      - tor

volumes:
  wa_auth:
  ethol_state:
  gluetun:
